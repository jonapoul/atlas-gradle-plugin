x-atlas: &atlas
  # CI overrides the tag when a PR rebuilds the image; defaults to the published one.
  image: ghcr.io/jonapoul/atlas-gradle-plugin:${ATLAS_IMAGE_TAG:-latest}
  # Lets scripts build the image locally, so they run against the tool versions
  # pinned in the Dockerfile rather than whatever is installed on the host.
  build:
    context: ..
    dockerfile: docker/Dockerfile
    secrets:
      - github_token
  volumes:
    - $HOME/.gradle:/home/gradle/.gradle
    - ..:/atlas
  working_dir: /atlas

  # Tests that need a tool the image might not have fail loudly on CI and skip locally, so the
  # flag has to reach the container - otherwise a missing tool silently skips on CI too.
  environment:
    CI: ${CI:-false}
    # Picks the Gradle, Kotlin and AGP versions from supported-versions.txt. Blank means the defaults
    ATLAS_GRADLE_VERSION: ${ATLAS_GRADLE_VERSION:-}
    ATLAS_KOTLIN_VERSION: ${ATLAS_KOTLIN_VERSION:-}
    ATLAS_AGP_VERSION: ${ATLAS_AGP_VERSION:-}

secrets:
  # Lets the d2 install call the GitHub API without hitting the unauthenticated rate limit.
  github_token:
    environment: GITHUB_TOKEN

services:
  check:
    <<: *atlas
    command: >
      gradle -Dorg.gradle.java.home=/opt/java/openjdk/ check

  test:
    <<: *atlas
    command: >
      gradle -Dorg.gradle.java.home=/opt/java/openjdk/ test

  samples:
    <<: *atlas
    command: ./scripts/runAtlasGenerate.sh
