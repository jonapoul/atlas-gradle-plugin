<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Chart Index</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --panel: #f4f4f8;
      --border: #d8d8e4;
      --text: #1c1c28;
      --muted: #6a6a80;
      --link: #1a5fd0;
      --bar: #3b5bdb;
      --row-hover: #ebebf4;
      --row-selected: #dbe4ff;
      --mark: #fff0a0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #00000a;
        --panel: #0d0d1a;
        --border: #24243a;
        --text: #dcdce6;
        --muted: #8a8aa3;
        --link: #8ab4f8;
        --row-hover: #16162a;
        --row-selected: #1f2a4d;
        --mark: #5c4d00;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      padding: 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 18px; }
    .stats { display: flex; gap: 16px; margin-left: auto; color: var(--muted); }
    .stats b { color: var(--text); font-weight: normal; }
    input[type="search"], select {
      padding: 6px 10px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
    }
    input[type="search"] { flex: 1; min-width: 200px; max-width: 400px; }
    label { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
    main { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 16px; }
    .list { flex: none; overflow-y: auto; }
    table { border-collapse: collapse; }
    th {
      position: sticky;
      top: 0;
      padding: 0;
      background: var(--bg);
      font-weight: normal;
      border-bottom: 1px solid var(--border);
    }
    th button {
      width: 100%;
      padding: 6px 8px;
      color: var(--muted);
      background: none;
      border: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th button:hover, th button:focus-visible { color: var(--text); background: var(--row-hover); }
    th button::after { content: " \2195"; opacity: 0.4; }
    th[aria-sort] button::after { opacity: 1; }
    th[aria-sort="ascending"] button::after { content: " \25B2"; }
    th[aria-sort="descending"] button::after { content: " \25BC"; }
    td { padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr { scroll-margin-top: 40px; }
    tbody tr.selected { background: var(--row-selected); }
    tr.none td { padding: 24px 8px; color: var(--muted); text-align: center; border-bottom: none; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .size { display: flex; align-items: center; gap: 8px; }
    .size span { min-width: 64px; }
    .bar { height: 6px; background: var(--bar); border-radius: 3px; }
    .barbox { width: 60px; display: flex; justify-content: flex-start; }
    .muted { color: var(--muted); }
    mark { color: inherit; background: var(--mark); border-radius: 2px; }
    .type { display: inline-block; padding: 0 6px; border-radius: 3px; }
    aside {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    #preview-title { display: flex; gap: 12px; }
    #preview { flex: 1; min-height: 0; display: flex; overflow: hidden; }
    #preview.zoomable { cursor: grab; }
    #preview.dragging { cursor: grabbing; }
    #preview img, #preview iframe { flex: 1; min-width: 0; width: 100%; border: 0; object-fit: contain; }
    #preview .mermaid { flex: 1; display: flex; }
    #preview .mermaid svg { margin: auto; max-width: 100%; max-height: 100%; }
    #preview pre { flex: 1; margin: 0; overflow: auto; white-space: pre-wrap; }
    #preview .empty { margin: auto; color: var(--muted); }
    @media (max-width: 900px) {
      aside { display: none; }
      .list { flex: 1; }
    }
  </style>
</head>
<body>
<header>
  <h1>Atlas Chart Index</h1>
  <select id="framework" hidden></select>
  <input id="filter" type="search" placeholder="Filter projects (/)" autofocus>
  <label><input id="deep" type="checkbox"> Match dependencies</label>
  <span class="stats" id="stats"></span>
</header>
<main>
  <div class="list" id="list">
    <table>
      <thead>
        <tr>
          <th data-key="path"><button type="button">Project</button></th>
          <th data-key="type"><button type="button">Type</button></th>
          <th data-key="size"><button type="button">Size</button></th>
          <th data-key="modified"><button type="button">Modified</button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <aside>
    <div id="preview-title" class="muted">Hover a project to preview its chart</div>
    <div id="preview"></div>
  </aside>
</main>
<script>
  const MERMAID_URL = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  const IMAGES = ["svg", "png", "jpg", "jpeg", "gif", "webp"];

  const generated = __GENERATED__;
  const allCharts = __CHARTS__;
  const types = Object.fromEntries(__TYPES__.map(t => [t.projectPath, t.type]));
  const swatch = document.createElement("canvas").getContext("2d", { willReadFrequently: true });

  // Black or white, whichever contrasts better with the given CSS colour
  function textColorOn(color) {
    swatch.clearRect(0, 0, 1, 1);
    swatch.fillStyle = color;
    swatch.fillRect(0, 0, 1, 1);
    const [r, g, b] = [...swatch.getImageData(0, 0, 1, 1).data].slice(0, 3).map(v => {
      const c = v / 255;
      return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179 ? "#000" : "#fff";
  }

  allCharts.forEach(c => {
    const type = types[c.path];
    c.type = type ? type.name : "";
    c.color = type && type.color ? type.color : "";
    c.textColor = c.color ? textColorOn(c.color) : "";
    c.extension = c.url.split(".").pop().toLowerCase();
  });

  const deps = {};
  __LINKS__.forEach(l => (deps[l.fromPath] ||= []).push(l.toPath));
  const closures = {};
  function closure(path) {
    if (closures[path]) return closures[path];
    const seen = closures[path] = new Set([path]);
    (deps[path] || []).forEach(d => closure(d).forEach(p => seen.add(p)));
    return seen;
  }
  allCharts.forEach(c => c.mentions = [...closure(c.path)]);

  const list = document.getElementById("list");
  const rows = document.getElementById("rows");
  const frameworkSelect = document.getElementById("framework");
  const filter = document.getElementById("filter");
  const deep = document.getElementById("deep");
  const stats = document.getElementById("stats");
  const previewTitle = document.getElementById("preview-title");
  const previewPane = document.getElementById("preview");
  let sortKey = "path";
  let sortDir = "asc";
  let items = [];
  let selected = null;
  let previewed = null;
  let mermaid = null;
  let mermaidCount = 0;

  const frameworks = [...new Set(allCharts.map(c => c.framework))];
  frameworks.forEach(f => frameworkSelect.append(new Option(f, f)));
  frameworkSelect.hidden = frameworks.length < 2;
  const charts = () => allCharts.filter(c => c.framework === frameworkSelect.value);

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(2) + " MB";
  }

  function formatAge(millis) {
    const seconds = Math.round((generated - millis) / 1000);
    if (seconds < 60) return "just now";
    if (seconds < 3600) return Math.round(seconds / 60) + "m ago";
    if (seconds < 86400) return Math.round(seconds / 3600) + "h ago";
    return Math.round(seconds / 86400) + "d ago";
  }

  function el(tag, props, children) {
    const node = Object.assign(document.createElement(tag), props || {});
    (children || []).forEach(c => node.append(c));
    return node;
  }

  let view = { scale: 1, x: 0, y: 0 };
  let zoomTarget = null;
  let dragStart = null;

  function applyView() {
    if (zoomTarget) zoomTarget.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
  }

  function resetView(target) {
    zoomTarget = target;
    view = { scale: 1, x: 0, y: 0 };
    if (target) target.style.transformOrigin = "0 0";
    previewPane.classList.toggle("zoomable", !!target);
    previewPane.title = target ? "Scroll to zoom, drag to pan, double-click to reset" : "";
    applyView();
  }

  previewPane.addEventListener("wheel", e => {
    if (!zoomTarget) return;
    e.preventDefault();
    const rect = previewPane.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const scale = Math.min(20, Math.max(0.2, view.scale * Math.exp(-e.deltaY * 0.002)));
    const factor = scale / view.scale;
    view = { scale, x: px - (px - view.x) * factor, y: py - (py - view.y) * factor };
    applyView();
  }, { passive: false });

  previewPane.addEventListener("pointerdown", e => {
    if (!zoomTarget || e.button !== 0) return;
    dragStart = { x: e.clientX - view.x, y: e.clientY - view.y };
    previewPane.setPointerCapture(e.pointerId);
    previewPane.classList.add("dragging");
  });
  previewPane.addEventListener("pointermove", e => {
    if (!dragStart) return;
    view.x = e.clientX - dragStart.x;
    view.y = e.clientY - dragStart.y;
    applyView();
  });
  ["pointerup", "pointercancel"].forEach(type => previewPane.addEventListener(type, () => {
    dragStart = null;
    previewPane.classList.remove("dragging");
  }));
  previewPane.addEventListener("dblclick", () => resetView(zoomTarget));

  async function renderMermaid(chart) {
    try {
      mermaid ||= import(MERMAID_URL).then(m => {
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        m.default.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
        return m.default;
      });
      const { svg } = await (await mermaid).render("mermaid-" + mermaidCount++, chart.source);
      if (previewed !== chart) return;
      const node = el("div", { className: "mermaid" });
      node.innerHTML = svg;
      previewPane.replaceChildren(node);
      resetView(node);
    } catch (e) {
      mermaid = null;
      if (previewed !== chart) return;
      previewPane.replaceChildren(el("pre", { textContent: chart.source }));
    }
  }

  function preview(chart) {
    if (previewed === chart) return;
    previewed = chart;
    previewTitle.replaceChildren(
      el("span", { textContent: chart.path }),
      el("span", { className: "muted", textContent: formatSize(chart.size) }),
    );
    previewTitle.className = "";
    resetView(null);
    if (IMAGES.includes(chart.extension)) {
      const img = el("img", { src: chart.url, alt: chart.path, draggable: false });
      previewPane.replaceChildren(img);
      resetView(img);
    } else if (chart.extension === "pdf") {
      previewPane.replaceChildren(el("iframe", { src: chart.url, title: chart.path }));
    } else if (chart.source != null) {
      previewPane.replaceChildren(el("div", { className: "empty", textContent: "Rendering..." }));
      renderMermaid(chart);
    } else {
      previewPane.replaceChildren(
        el("div", { className: "empty", textContent: "No preview for ." + chart.extension + " files" }),
      );
    }
  }

  function saveState() {
    const params = new URLSearchParams();
    if (filter.value) params.set("q", filter.value);
    if (deep.checked) params.set("deep", "1");
    if (!frameworkSelect.hidden) params.set("framework", frameworkSelect.value);
    if (sortKey !== "path" || sortDir !== "asc") {
      params.set("sort", sortKey);
      params.set("dir", sortDir);
    }
    if (selected) params.set("project", selected.path);
    const hash = params.toString();
    try {
      history.replaceState(null, "", hash ? "#" + hash : location.pathname + location.search);
    } catch (e) {
      // Some browsers block history changes on file:// pages
    }
  }

  function loadState() {
    const params = new URLSearchParams(location.hash.slice(1));
    filter.value = params.get("q") || "";
    deep.checked = params.get("deep") === "1";
    if (frameworks.includes(params.get("framework"))) frameworkSelect.value = params.get("framework");
    if (document.querySelector('th[data-key="' + params.get("sort") + '"]')) sortKey = params.get("sort");
    if (params.get("dir") === "desc") sortDir = "desc";
    selected = charts().find(c => c.path === params.get("project")) || null;
  }

  function select(index, scroll) {
    items.forEach((item, i) => item.row.classList.toggle("selected", i === index));
    const item = items[index];
    if (item) {
      selected = item.chart;
      preview(item.chart);
      if (scroll) item.row.scrollIntoView({ block: "nearest" });
    }
    saveState();
  }

  function move(delta) {
    if (!items.length) return;
    const current = items.findIndex(i => i.chart === selected);
    const next = current < 0 ? 0 : Math.min(items.length - 1, Math.max(0, current + delta));
    select(next, true);
  }

  function fuzzy(text, query) {
    let i = 0;
    for (const ch of text.toLowerCase()) {
      if (ch === query[i]) i++;
      if (i === query.length) return true;
    }
    return i === query.length;
  }

  function matchIndices(text, query) {
    const lower = text.toLowerCase();
    const hits = [];
    for (let j = 0; j < lower.length && hits.length < query.length; j++) {
      if (lower[j] === query[hits.length]) hits.push(j);
    }
    return hits.length === query.length ? hits : [];
  }

  function highlight(text, terms) {
    const hits = new Set(terms.flatMap(t => matchIndices(text, t)));
    const parts = [];
    let run = "";
    let marked = false;
    [...text].forEach((ch, j) => {
      if (hits.has(j) !== marked) {
        if (run) parts.push(marked ? el("mark", { textContent: run }) : run);
        run = "";
        marked = !marked;
      }
      run += ch;
    });
    if (run) parts.push(marked ? el("mark", { textContent: run }) : run);
    return parts;
  }

  function render() {
    const shown = charts();
    const maxSize = Math.max(1, ...shown.map(c => c.size));
    const terms = filter.value.toLowerCase().split(/\s+/).filter(Boolean);
    const visible = shown
      .filter(c => deep.checked
        ? c.mentions.some(m => terms.every(t => fuzzy(m, t)))
        : terms.every(t => fuzzy(c.path, t) || fuzzy(c.type, t)))
      .sort((a, b) => {
        const x = a[sortKey], y = b[sortKey];
        const order = x < y ? -1 : x > y ? 1 : 0;
        return sortDir === "asc" ? order : -order;
      });

    rows.replaceChildren();
    items = [];
    visible.forEach(chart => {
      const width = Math.max(2, Math.round(chart.size / maxSize * 60));
      const row = el("tr", {}, [
        el("td", {}, [el("a", { href: chart.url, target: "_blank" }, highlight(chart.path, terms))]),
        el("td", {}, [el("span", { className: "type", textContent: chart.type, style: chart.color ? "background:" + chart.color + ";color:" + chart.textColor : "" })]),
        el("td", {}, [
          el("div", { className: "size" }, [
            el("span", { textContent: formatSize(chart.size) }),
            el("div", { className: "barbox" }, [el("div", { className: "bar", style: "width:" + width + "px" })]),
          ]),
        ]),
        el("td", { className: "muted", title: new Date(chart.modified).toLocaleString() }, [formatAge(chart.modified)]),
      ]);
      const index = items.length;
      items.push({ chart, row });
      row.addEventListener("mouseenter", () => select(index, false));
      rows.append(row);
    });
    if (!visible.length) {
      const columns = document.querySelectorAll("th").length;
      rows.append(el("tr", { className: "none" }, [el("td", { colSpan: columns, textContent: "No matching projects" })]));
    }
    select(items.findIndex(i => i.chart === selected), false);

    const total = visible.reduce((sum, c) => sum + c.size, 0);
    stats.replaceChildren(
      el("span", {}, [el("b", { textContent: visible.length }), " of " + shown.length + " charts"]),
      el("span", {}, [el("b", { textContent: formatSize(total) })]),
      el("span", { textContent: "Generated " + new Date(generated).toLocaleString() }),
    );
  }

  function showSort() {
    document.querySelectorAll("th").forEach(th => {
      if (th.dataset.key === sortKey) {
        th.setAttribute("aria-sort", sortDir === "asc" ? "ascending" : "descending");
      } else {
        th.removeAttribute("aria-sort");
      }
    });
  }

  document.querySelectorAll("th").forEach(th => {
    th.querySelector("button").addEventListener("click", () => {
      const key = th.dataset.key;
      sortDir = sortKey === key && sortDir === "asc" ? "desc" : "asc";
      sortKey = key;
      showSort();
      render();
    });
  });
  loadState();
  showSort();

  frameworkSelect.addEventListener("change", () => {
    const path = selected && selected.path;
    selected = charts().find(c => c.path === path) || null;
    render();
  });
  filter.addEventListener("input", render);
  deep.addEventListener("change", render);
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== filter) {
      e.preventDefault();
      filter.focus();
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      move(e.key === "ArrowDown" ? 1 : -1);
    } else if (e.key === "Enter" && selected && [filter, document.body].includes(document.activeElement)) {
      e.preventDefault();
      window.open(selected.url, "_blank");
    } else if (e.key === "Escape" && document.activeElement === filter) {
      e.preventDefault();
      if (filter.value) {
        filter.value = "";
        render();
      } else {
        filter.blur();
      }
    }
  });

  render();
  list.style.minWidth = list.offsetWidth + "px";
  const restored = items.find(i => i.chart === selected);
  if (restored) restored.row.scrollIntoView({ block: "center" });
</script>
</body>
</html>
