name: Docker Login
description: Log in to the GitHub container registry

runs:
  using: composite
  steps:
    - name: Login to registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
