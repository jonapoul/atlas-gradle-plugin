name: Docker Login
description: Log in to the GitHub container registry

runs:
  using: composite
  steps:
    - name: Login to registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
