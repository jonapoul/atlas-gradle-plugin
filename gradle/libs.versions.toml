[versions]
agp = "9.4.1"
blueprint = "2.4.2"
junit = "6.1.3"
kotlin = "2.4.20"

[libraries]
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version = "0.28.1" }
blueprint = { module = "dev.jonpoulton.blueprint:core", version.ref = "blueprint" }
blueprint-testAssertk = { module = "dev.jonpoulton.blueprint:test-assertk", version.ref = "blueprint" }
detekt-gradle = { module = "dev.jonpoulton.detekt:gradle-detekt-rules", version = "0.1.0" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
ktfmt = { module = "com.facebook:ktfmt", version = "0.64" } # only used in ktfmt.sh

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
agp-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
agp-lib = { id = "com.android.library", version.ref = "agp" }
blueprint = { id = "dev.jonpoulton.blueprint", version.ref = "blueprint" }
blueprintTest = { id = "dev.jonpoulton.blueprint.test", version.ref = "blueprint" }
buildConfig = { id = "com.github.gmazzo.buildconfig", version = "6.1.0" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
licensee = { id = "app.cash.licensee", version = "1.14.1" }
publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
